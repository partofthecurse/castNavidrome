name: build docker image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Build Docker image
        run: |
          docker build . -t partofthecurse/castnavidrome:latest
      - name: Push Docker image
        run: |
           docker push partofthecurse/castnavidrome:latest