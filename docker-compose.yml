services:
  castnavidrome:
    container_name: castnavidrome
    build:
      context: .
      dockerfile: Dockerfile
    image: 'castnavidrome:local'
    environment:
      - 'NAVI_SKILL_ID=${NAVI_SKILL_ID}'
      - 'NAVI_URL=${NAVI_URL}'
      - 'NAVI_BASE_URL=${NAVI_BASE_URL}'
      - 'NAVI_USER=${NAVI_USER}'
      - 'NAVI_PASS=${NAVI_PASS}'
      - 'NAVI_ALEXA_API_KEY=${NAVI_ALEXA_API_KEY}'
      - 'NAVI_ALEXA_COOKIE_FILE=/run/secrets/alexa.cookies'
      - 'NAVI_AMAZON_SESSION_FILE=/var/lib/castnavidrome/amazon_session.json'
    volumes:
      - './.secrets/alexa.cookies:/run/secrets/alexa.cookies:ro'
      - './state:/var/lib/castnavidrome'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped

  # Exposes every selected Alexa device as its own UPnP media renderer.
  # The container needs the host network so that the SSDP port 1900/udp can
  # be used for the discovery of the renderers.
  castnavidrome-renderer:
    build:
      context: .
      dockerfile: Dockerfile
    image: 'castnavidrome:local'
    container_name: castnavidrome-renderer
    network_mode: host
    command: ['python3', '-m', 'castnavidrome.renderer_host']
    environment:
      - 'NAVI_ALEXA_COOKIE_FILE=/run/secrets/alexa.cookies'
    volumes:
      - './.secrets/alexa.cookies:/run/secrets/alexa.cookies:ro'
      - './state:/var/lib/castnavidrome'
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-${SERVICE}
    hostname: ${SERVICE}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
    volumes:
      - './config:/config'
      - './ts/state:/var/lib/tailscale'
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    ports:
      - 0.0.0.0:${SERVICEPORT}:${SERVICEPORT}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
