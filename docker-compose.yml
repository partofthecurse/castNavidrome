services:
    castnavidrome: 
        container_name: castnavidrome      
        environment:
        - 'NAVI_SKILL_ID=${NAVI_SKILL_ID}' #from https://developer.amazon.com/alexa/console/ask (copy skill id from the skill's URL)
        - 'NAVI_URL=${NAVI_URL}' #publicly accessible navidrome URL with https:// and no trailing slash
        - 'NAVI_BASE_URL=${NAVI_BASE_URL}' #publicly accessible URL of this skill, it is used for the cover art of the cards
        - 'NAVI_USER=${NAVI_USER}' #your navidrome username
        - 'NAVI_PASS=${NAVI_PASS}' #your navidrome password
        - 'NAVI_SONG_COUNT=50' #number of songs for e.g. genre playlists, default is 50
        - 'NAVI_PORT=443' #port for the castnavidrome webserver, default is 443
        - 'NAVI_API_PATH=/rest'
        - 'NAVI_API_VER=1.16.1'
        - 'NAVI_DEBUG_TOKEN=${NAVI_DEBUG_TOKEN:-}'
        - 'NAVI_RADIO_URL=${NAVI_RADIO_URL:-}'
        - 'NAVI_RADIO_STATIONS_URL=${NAVI_RADIO_STATIONS_URL:-}'
        - 'NAVI_PLAYLIST_NAME_PATTERN=${NAVI_PLAYLIST_NAME_PATTERN:-}'
        - 'NAVI_PLAYLIST_SPOKEN_FORMAT=${NAVI_PLAYLIST_SPOKEN_FORMAT:-}'
        - 'NAVI_PLAYLIST_QUALIFIED_FORMAT=${NAVI_PLAYLIST_QUALIFIED_FORMAT:-}'
        - 'NAVI_DEBUG=1'
        - 'NAVI_ALEXA_API_KEY=${NAVI_ALEXA_API_KEY}' #generate it yourself e.g. with openssl rand -hex 32
        - 'NAVI_ALEXA_DOMAIN=${NAVI_ALEXA_DOMAIN:-amazon.com}' #your Alexa domain in your country (e.g. amazon.de, amazon.com, amazon.co.uk, etc.)
        - 'NAVI_ALEXA_LOCALE=${NAVI_ALEXA_LOCALE:-de-DE}' #your Alexa locale in your country (e.g. de-DE, en-US, en-GB, etc.)
        - 'NAVI_AMAZON_USER=${NAVI_AMAZON_USER:-}'          #Amazon username (env var or Docker secret), enables the automatic login flow
        - 'NAVI_AMAZON_PASS=${NAVI_AMAZON_PASS:-}'          #Amazon password (env var or Docker secret), never logged
        - 'NAVI_AMAZON_TOTP_SECRET=${NAVI_AMAZON_TOTP_SECRET:-}'  #TOTP/2FA secret in base32 (env var or Docker secret)
        - 'NAVI_AMAZON_SESSION_FILE=/var/lib/castnavidrome/amazon_session.json'  #persisted Amazon session cookies
        - 'NAVI_ALEXA_SKILL_NAME=${NAVI_ALEXA_SKILL_NAME:-castnavidrome}'               #invocation name of the Alexa skill you created in developer.amazon.com. should not be easily mistakable with other stuff
        - 'NAVI_ALEXA_COOKIE_FILE=/run/secrets/alexa.cookies'                       #path to the Alexa cookie file. you need to get the cookie file from an active session of your Amazon account.
        - 'NAVI_ALEXA_RENDERER_STATE_FILE=${NAVI_ALEXA_RENDERER_STATE_FILE:-/var/lib/castnavidrome/renderer-devices.json}' #the registry that maps the Alexa devices to their media renderer UUID
        volumes:
            - './.secrets/alexa.cookies:/run/secrets/alexa.cookies:ro'
            - './state:/var/lib/castnavidrome'
        build:
            context: .
            dockerfile: Dockerfile
        image: 'castnavidrome:local'
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "1"
        depends_on:
            tailscale:
                condition: service_healthy
        networks:
            default:
                aliases:
                - castnavidrome-app
        restart: unless-stopped

    # Exposes every selected Alexa device as its own UPnP media renderer.
    # The container needs the host network so that the SSDP port 1900/udp can
    # be used for the discovery of the renderers.
    castnavidrome-renderer:
        build:
            context: .
            dockerfile: Dockerfile
        image: 'castnavidrome:local'
        container_name: castnavidrome-renderer
        network_mode: host
        command: ['python3', '-m', 'castnavidrome.renderer_host']
        environment:
            - 'NAVI_ALEXA_RENDERER_ENABLED=${NAVI_ALEXA_RENDERER_ENABLED:-yes}'
            - 'NAVI_ALEXA_RENDERER_STATE_FILE=/var/lib/castnavidrome/renderer-devices.json'
            - 'NAVI_ALEXA_RENDERER_ADVERTISE_HOST=${NAVI_ALEXA_RENDERER_ADVERTISE_HOST:-}'      #the IP address that Navidrome uses to reach the renderers, detected automatically when empty
            - 'NAVI_ALEXA_RENDERER_PORT=${NAVI_ALEXA_RENDERER_PORT:-49443}'                    #the port of the UPnP description and control endpoints
            - 'NAVI_ALEXA_RENDERER_REFRESH_SECONDS=${NAVI_ALEXA_RENDERER_REFRESH_SECONDS:-300}' #how often the Alexa device list is refreshed
            - 'NAVI_ALEXA_RENDERER_MIN_REFRESH_SECONDS=${NAVI_ALEXA_RENDERER_MIN_REFRESH_SECONDS:-60}' #minimum time between two refreshes that are triggered by a search request
            - 'NAVI_ALEXA_RENDERER_NAME_PREFIX=${NAVI_ALEXA_RENDERER_NAME_PREFIX-}'  #optional prefix of the renderer names, the renderers are named after the Alexa device when it is empty
            - 'NAVI_ALEXA_RENDERER_DEVICE_TYPES=${NAVI_ALEXA_RENDERER_DEVICE_TYPES:-}'          #comma separated list of allowed device types, all types when empty
            - 'NAVI_ALEXA_RENDERER_EXCLUDED_DEVICE_TYPES=${NAVI_ALEXA_RENDERER_EXCLUDED_DEVICE_TYPES:-}' #device types that are never exposed, tablets and e-readers when empty
            - 'NAVI_ALEXA_RENDERER_NAME_INCLUDE=${NAVI_ALEXA_RENDERER_NAME_INCLUDE:-}'          #comma separated list of device names, all names when empty
            - 'NAVI_ALEXA_RENDERER_NAME_EXCLUDE=${NAVI_ALEXA_RENDERER_NAME_EXCLUDE:-}'          #comma separated list of device names that are never exposed
            - 'NAVI_ALEXA_RENDERER_NAME_REGEX=${NAVI_ALEXA_RENDERER_NAME_REGEX:-}'              #regular expression that the device name has to match
            - 'NAVI_ALEXA_RENDERER_ONLY_ONLINE=${NAVI_ALEXA_RENDERER_ONLY_ONLINE:-no}'          #only expose devices that are currently online
            - 'NAVI_ALEXA_RENDERER_ANNOUNCE=${NAVI_ALEXA_RENDERER_ANNOUNCE:-explicit}'          #how the renderers announce the tracks: explicit, always or never
            - 'NAVI_ALEXA_RENDERER_LOG_LEVEL=${NAVI_ALEXA_RENDERER_LOG_LEVEL:-INFO}'        #log level of the renderer service, DEBUG shows the http requests of the clients
            - 'NAVI_ALEXA_COOKIE_FILE=/run/secrets/alexa.cookies'
            - 'NAVI_ALEXA_DOMAIN=${NAVI_ALEXA_DOMAIN:-amazon.com}'
            - 'NAVI_ALEXA_SKILL_NAME=${NAVI_ALEXA_SKILL_NAME:-castnavidrome}'
            - 'NAVI_ALEXA_LOCALE=${NAVI_ALEXA_LOCALE:-de-DE}'
            - 'NAVI_AMAZON_USER=${NAVI_AMAZON_USER:-}'          #Amazon username (env var or Docker secret), enables the automatic login flow
            - 'NAVI_AMAZON_PASS=${NAVI_AMAZON_PASS:-}'          #Amazon password (env var or Docker secret), never logged
            - 'NAVI_AMAZON_TOTP_SECRET=${NAVI_AMAZON_TOTP_SECRET:-}'  #TOTP/2FA secret in base32 (env var or Docker secret)
            - 'NAVI_AMAZON_SESSION_FILE=/var/lib/castnavidrome/amazon_session.json'  #persisted Amazon session cookies
            - 'NAVI_URL=${NAVI_URL}'
            - 'NAVI_USER=${NAVI_USER}'
            - 'NAVI_PASS=${NAVI_PASS}'
            - 'NAVI_PORT=${NAVI_PORT:-443}'
            - 'NAVI_API_PATH=/rest'
            - 'NAVI_API_VER=1.16.1'
            - 'NAVI_DEBUG_TOKEN=${NAVI_DEBUG_TOKEN:-}'
            - 'NAVI_RADIO_URL=${NAVI_RADIO_URL:-}'
            - 'NAVI_RADIO_STATIONS_URL=${NAVI_RADIO_STATIONS_URL:-}'
            - 'NAVI_PLAYLIST_NAME_PATTERN=${NAVI_PLAYLIST_NAME_PATTERN:-}'
            - 'NAVI_PLAYLIST_SPOKEN_FORMAT=${NAVI_PLAYLIST_SPOKEN_FORMAT:-}'
            - 'NAVI_PLAYLIST_QUALIFIED_FORMAT=${NAVI_PLAYLIST_QUALIFIED_FORMAT:-}'
        volumes:
            - './.secrets/alexa.cookies:/run/secrets/alexa.cookies:ro'
            - './state:/var/lib/castnavidrome'
        restart: unless-stopped

    tailscale:
        image: tailscale/tailscale:latest # Image to be used
        container_name: tailscale-${SERVICE} # Name for local container management
        hostname: ${SERVICE} # Name used within your Tailscale environment
        environment:
        - TS_AUTHKEY=${TS_AUTHKEY}
        - TS_STATE_DIR=/var/lib/tailscale
        - TS_SERVE_CONFIG=/config/serve.json # Tailscale Serve configuration to expose the web interface on your local Tailnet - remove this line if not required
        - TS_USERSPACE=false
        - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
        - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       # The <addr>:<port> for the healthz endpoint
        #- TS_ACCEPT_DNS=true # Uncomment only if the service must resolve MagicDNS names - this replaces Docker DNS, so Compose service names no longer resolve
        - TS_AUTH_ONCE=true
        # configs:
        #   - source: ts-serve
        #     target: /config/serve.json
        volumes:
        - ./config:/config # Config folder used to store Tailscale files - you may need to change the path
        - ./ts/state:/var/lib/tailscale # Tailscale requirement - you may need to change the path
        devices:
        - /dev/net/tun:/dev/net/tun # Network configuration for Tailscale to work
        cap_add:
        - net_admin # Tailscale requirement
        ports:
        - 0.0.0.0:${SERVICEPORT}:${SERVICEPORT} # Binding the service port to the local network - may be removed if only exposure to your Tailnet is required
        # If any DNS issues arise, use your preferred DNS provider by uncommenting the config below
        #dns:
        #  - ${DNS_SERVER}
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
            interval: 1m # How often to perform the check
            timeout: 10s # Time to wait for the check to succeed
            retries: 3 # Number of retries before marking as unhealthy
            start_period: 10s # Time to wait before starting health checks
            #user: 1000:1000
        restart: unless-stopped