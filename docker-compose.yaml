services:
  castnavidrome:
    container_name: castnavidrome
    build:
      context: .
      dockerfile: Dockerfile
    image: 'castnavidrome:local'
    environment:
      - 'NAVI_SKILL_ID=${NAVI_SKILL_ID}'
      - 'NAVI_URL=${NAVI_URL}'
      - 'NAVI_BASE_URL=${NAVI_BASE_URL}'
      - 'NAVI_USER=${NAVI_USER}'
      - 'NAVI_PASS=${NAVI_PASS}'
      - 'NAVI_ALEXA_API_KEY=${NAVI_ALEXA_API_KEY}'
      - 'NAVI_ALEXA_COOKIE_FILE=/run/secrets/alexa.cookies'
      - 'NAVI_ALEXA_DOMAIN=${NAVI_ALEXA_DOMAIN}'
      - 'NAVI_ALEXA_LOCALE=${NAVI_ALEXA_LOCALE}'
      - 'NAVI_ALEXA_SKILL_NAME=${NAVI_ALEXA_SKILL_NAME}'
      # Amazon OAuth (Login with Amazon) — required for the OAuth login flow
      - 'NAVI_AMAZON_CLIENT_ID=${NAVI_AMAZON_CLIENT_ID}'
      - 'NAVI_AMAZON_CLIENT_SECRET=${NAVI_AMAZON_CLIENT_SECRET}'
      - 'NAVI_AMAZON_REDIRECT_URI=${NAVI_AMAZON_REDIRECT_URI}'
      - 'NAVI_AMAZON_TOKEN_FILE=/var/lib/castnavidrome/amazon_oauth_token.json'
      - 'NAVI_AMAZON_SCOPES=${NAVI_AMAZON_SCOPES}'
      - 'NAVI_AMAZON_SESSION_FILE=/var/lib/castnavidrome/amazon_session.json'
      - 'NAVI_PORT=${NAVI_PORT}'
      - 'NAVI_API_PATH=${NAVI_API_PATH}'
      - 'NAVI_API_VER=${NAVI_API_VER}'
      - 'NAVI_DEBUG=${NAVI_DEBUG}'
    volumes:
      - './.secrets/alexa.cookies:/run/secrets/alexa.cookies:ro'
      - './state:/var/lib/castnavidrome'
    networks:
      default:
        aliases:
          - castnavidrome-app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped

  # Exposes every selected Alexa device as its own UPnP media renderer.
  # The container needs the host network so that the SSDP port 1900/udp can
  # be used for the discovery of the renderers.
  castnavidrome-renderer:
    build:
      context: .
      dockerfile: Dockerfile
    image: 'castnavidrome:local'
    container_name: castnavidrome-renderer
    network_mode: host
    command: ['python3', '-m', 'castnavidrome.renderer_host']
    environment:
      - 'NAVI_ALEXA_COOKIE_FILE=/run/secrets/alexa.cookies'
      - 'NAVI_ALEXA_RENDERER_LOG_LEVEL=${NAVI_ALEXA_RENDERER_LOG_LEVEL}'
      - 'NAVI_ALEXA_RENDERER_ENABLED=${NAVI_ALEXA_RENDERER_ENABLED}'
      - 'NAVI_ALEXA_RENDERER_STATE_FILE=/var/lib/castnavidrome/renderer-devices.json'
      - 'NAVI_ALEXA_RENDERER_ADVERTISE_HOST=${NAVI_ALEXA_RENDERER_ADVERTISE_HOST}'
      - 'NAVI_ALEXA_RENDERER_PORT=${NAVI_ALEXA_RENDERER_PORT}'
      - 'NAVI_ALEXA_RENDERER_REFRESH_SECONDS=${NAVI_ALEXA_RENDERER_REFRESH_SECONDS}'
      - 'NAVI_ALEXA_RENDERER_MIN_REFRESH_SECONDS=${NAVI_ALEXA_RENDERER_MIN_REFRESH_SECONDS}'
      - 'NAVI_ALEXA_RENDERER_NAME_PREFIX=${NAVI_ALEXA_RENDERER_NAME_PREFIX}'
      - 'NAVI_ALEXA_RENDERER_DEVICE_TYPES=${NAVI_ALEXA_RENDERER_DEVICE_TYPES}'
      - 'NAVI_ALEXA_RENDERER_EXCLUDED_DEVICE_TYPES=${NAVI_ALEXA_RENDERER_EXCLUDED_DEVICE_TYPES}'
      - 'NAVI_ALEXA_RENDERER_NAME_INCLUDE=${NAVI_ALEXA_RENDERER_NAME_INCLUDE}'
      - 'NAVI_ALEXA_RENDERER_NAME_EXCLUDE=${NAVI_ALEXA_RENDERER_NAME_EXCLUDE}'
      - 'NAVI_ALEXA_RENDERER_NAME_REGEX=${NAVI_ALEXA_RENDERER_NAME_REGEX}'
      - 'NAVI_ALEXA_RENDERER_ONLY_ONLINE=${NAVI_ALEXA_RENDERER_ONLY_ONLINE}'
      - 'NAVI_ALEXA_RENDERER_ANNOUNCE=${NAVI_ALEXA_RENDERER_ANNOUNCE}'
      - 'NAVI_URL=${NAVI_URL}'
      - 'NAVI_USER=${NAVI_USER}'
      - 'NAVI_PASS=${NAVI_PASS}'
      - 'NAVI_PORT=${NAVI_PORT}'
      - 'NAVI_API_PATH=${NAVI_API_PATH}'
      - 'NAVI_API_VER=${NAVI_API_VER}'
      - 'NAVI_ALEXA_DOMAIN=${NAVI_ALEXA_DOMAIN}'
      - 'NAVI_ALEXA_SKILL_NAME=${NAVI_ALEXA_SKILL_NAME}'
      - 'NAVI_ALEXA_LOCALE=${NAVI_ALEXA_LOCALE}'
      # Amazon OAuth (Login with Amazon)
      - 'NAVI_AMAZON_CLIENT_ID=${NAVI_AMAZON_CLIENT_ID}'
      - 'NAVI_AMAZON_CLIENT_SECRET=${NAVI_AMAZON_CLIENT_SECRET}'
      - 'NAVI_AMAZON_REDIRECT_URI=${NAVI_AMAZON_REDIRECT_URI}'
      - 'NAVI_AMAZON_TOKEN_FILE=/var/lib/castnavidrome/amazon_oauth_token.json'
    volumes:
      - './.secrets/alexa.cookies:/run/secrets/alexa.cookies:ro'
      - './state:/var/lib/castnavidrome'
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-${SERVICE}
    hostname: ${SERVICE}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
      - TS_CERT_DOMAIN=castnavidrome.drake-aldebaran.ts.net
    volumes:
      - './config:/config'
      - './ts/state:/var/lib/tailscale'
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    ports:
      - 0.0.0.0:${SERVICEPORT}:${SERVICEPORT}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
