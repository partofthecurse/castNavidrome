services:
  castnavidrome:
    container_name: castnavidrome
    build:
      context: .
      dockerfile: Dockerfile
    image: 'castnavidrome:local'
    environment:
      # ---- Required (no default) ----
      - 'NAVI_SKILL_ID=${NAVI_SKILL_ID}'
      - 'NAVI_URL=${NAVI_URL}'
      - 'NAVI_BASE_URL=${NAVI_BASE_URL}'
      - 'NAVI_USER=${NAVI_USER}'
      - 'NAVI_PASS=${NAVI_PASS}'
      - 'NAVI_ALEXA_API_KEY=${NAVI_ALEXA_API_KEY}'
      - 'NAVI_ALEXA_SKILL_NAME=${NAVI_ALEXA_SKILL_NAME}'
      - 'TS_AUTHKEY=${TS_AUTHKEY}'
      # ---- Optional (defaults in skill/castnavidrome/app.py) ----
      - 'NAVI_ALEXA_DOMAIN=${NAVI_ALEXA_DOMAIN:-amazon.com}'
      - 'NAVI_ALEXA_LOCALE=${NAVI_ALEXA_LOCALE:-en-US}'
      # Amazon OAuth (Login with Amazon) - required when the OAuth flow is used
      - 'NAVI_AMAZON_CLIENT_ID=${NAVI_AMAZON_CLIENT_ID}'
      - 'NAVI_AMAZON_CLIENT_SECRET=${NAVI_AMAZON_CLIENT_SECRET}'
      - 'NAVI_AMAZON_REDIRECT_URI=${NAVI_AMAZON_REDIRECT_URI}'
      - 'NAVI_AMAZON_TOKEN_FILE=${NAVI_AMAZON_TOKEN_FILE:-/var/lib/castnavidrome/amazon_oauth_token.json}'
      - 'NAVI_AMAZON_SCOPES=${NAVI_AMAZON_SCOPES:-profile}'
      - 'NAVI_AMAZON_SESSION_FILE=${NAVI_AMAZON_SESSION_FILE:-/var/lib/castnavidrome/amazon_session.json}'
      - 'NAVI_AUTO_RESTART_ON_OAUTH_TOKEN_SAVE=${NAVI_AUTO_RESTART_ON_OAUTH_TOKEN_SAVE}'
    volumes:
      - './.secrets/alexa.cookies:/run/secrets/alexa.cookies:ro'
      - './state:/var/lib/castnavidrome'
    networks:
      default:
        aliases:
          - castnavidrome-app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Exposes every selected Alexa device as its own UPnP media renderer.
  # The container needs the host network so that the SSDP port 1900/udp can
  # be used for the discovery of the renderers.
  castnavidrome-renderer:
    build:
      context: .
      dockerfile: Dockerfile
    image: 'castnavidrome:local'
    container_name: castnavidrome-renderer
    network_mode: host
    command: ['python3', '-m', 'castnavidrome.renderer_host']
    environment:
      # ---- Required (no default) ----
      - 'NAVI_URL=${NAVI_URL}'
      - 'NAVI_USER=${NAVI_USER}'
      - 'NAVI_PASS=${NAVI_PASS}'
      - 'NAVI_ALEXA_API_KEY=${NAVI_ALEXA_API_KEY}'
      - 'NAVI_ALEXA_SKILL_NAME=${NAVI_ALEXA_SKILL_NAME}'
      - 'TS_AUTHKEY=${TS_AUTHKEY}'
      # ---- Optional (defaults in skill/castnavidrome/renderer_host.py) ----
      - 'NAVI_ALEXA_DOMAIN=${NAVI_ALEXA_DOMAIN:-amazon.com}'
      - 'NAVI_ALEXA_LOCALE=${NAVI_ALEXA_LOCALE:-en-US}'
      - 'NAVI_ALEXA_RENDERER_NAME_EXCLUDE=${NAVI_ALEXA_RENDERER_NAME_EXCLUDE}'
      - 'NAVI_ALEXA_RENDERER_DISABLE_BYEBYE=${NAVI_ALEXA_RENDERER_DISABLE_BYEBYE}'
      # Amazon OAuth (Login with Amazon) - required when the OAuth flow is used
      - 'NAVI_AMAZON_CLIENT_ID=${NAVI_AMAZON_CLIENT_ID}'
      - 'NAVI_AMAZON_CLIENT_SECRET=${NAVI_AMAZON_CLIENT_SECRET}'
      - 'NAVI_AMAZON_REDIRECT_URI=${NAVI_AMAZON_REDIRECT_URI}'
      - 'NAVI_AMAZON_TOKEN_FILE=${NAVI_AMAZON_TOKEN_FILE:-/var/lib/castnavidrome/amazon_oauth_token.json}'
      - 'NAVI_AMAZON_SCOPES=${NAVI_AMAZON_SCOPES:-profile}'
      - 'NAVI_AMAZON_SESSION_FILE=${NAVI_AMAZON_SESSION_FILE:-/var/lib/castnavidrome/amazon_session.json}'
      - 'NAVI_AUTO_RESTART_ON_OAUTH_TOKEN_SAVE=${NAVI_AUTO_RESTART_ON_OAUTH_TOKEN_SAVE}'
    volumes:
      - './.secrets/alexa.cookies:/run/secrets/alexa.cookies:ro'
      - './state:/var/lib/castnavidrome'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect(('127.0.0.1', 49443)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-${SERVICE:-castnavidrome}
    hostname: ${SERVICE:-castnavidrome}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
      - TS_CERT_DOMAIN=${TS_CERT_DOMAIN}
    volumes:
      - './config:/config'
      - './ts/state:/var/lib/tailscale'
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    ports:
      - 0.0.0.0:${SERVICEPORT}:${SERVICEPORT}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped